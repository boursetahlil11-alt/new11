name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack project
        run: unzip -q project.zip -d app_project
      - name: Add recordings if present
        run: |
          if [ -d audio ]; then
            mkdir -p app_project/app/src/main/assets/audio
            cp audio/* app_project/app/src/main/assets/audio/
          fi
      - name: Build debug APK
        working-directory: app_project
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Build release APK (smaller)
        continue-on-error: true
        working-directory: app_project
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kalamyab-apk
          path: |
            app_project/app/build/outputs/apk/debug/*.apk
            app_project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
